<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link href="style.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cause:wght@100..900&family=Comfortaa:wght@300..700&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Roboto:ital,wght@0,100..900;1,100..900&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="modal">
        <div class="BookDetails">
            
            <input class="image" type="file">
            
            <div class="edit">
                <label class="Heading-Font">Book Title</label>
                <input title="BookTitle" class="Body-Font" placeholder="">
                <label class="Heading-Font">Author</label>
                <input title="Author" placeholder="" class="Body-Font">
                <label class="Heading-Font">Pages</label>
                <input title="Pages" placeholder="" class="Body-Font">
                <label for="genre" class="Heading-Font">Book Genre</label>
                <select id="genre" name="genre" class="Body-Font">
                    <option value="Fiction">Fiction</option>
                    <option value="Sci-Fi">Sci-Fi</option>
                    <option value="Mystery">Mystery</option>
                    <option value="History">History</option>
                </select>
                <label class="Heading-Font">
                    <input type="checkbox" title="BookRead">
                    Read Completed
                </label>
                <div class="buttons">
                    <button class="cancel Heading-Font">Cancel</button>
                    <button class="save Heading-Font">Save Changes</button>
                    <button class="delete Heading-Font">Delete Book</button>
                </div>
            </div>
        </div>
    </div>
    <main>
        <nav>
            <div>
                <h1 class="Heading-Font logo">The Personal</h1>
                <h3 class="Body-Font">Library</h3>
            </div>
            <div id="search">
                <input placeholder="Search by book title ..." class="Body-Font">
            </div>
        </nav>
        <div id="content">
            <div id="SidePanel">
                <div class="checkboxes radio">
                    <h1 class="Heading-Font">Filters</h1>
                    <label class="Body-Font">
                        <input type="radio" id="All" name="status" checked>
                        All Books
                    </label>
                    <label class="Body-Font">
                        <input type="radio" id="Read" name="status">
                        Read
                    </label>
                    <label class="Body-Font">
                        <input type="radio" id="Unread" name="status">
                        Unread
                    </label>
                </div>
                <div class="checkboxes">
                    <h1 class="Heading-Font ">Genres</h1>
                    <label class="Body-Font">
                        <input class="genre" type="checkbox" value="Fiction">
                        Fiction
                    </label>
                    <label class="Body-Font">
                        <input class="genre" type="checkbox" value="Sci-Fi">
                        Sci-Fi
                    </label>
                    <label class="Body-Font">
                        <input class="genre" type="checkbox" value="Mystery">
                        Mystery
                    </label>
                    <label class="Body-Font">
                        <input class="genre" type="checkbox" value="History">
                        History
                    </label>
                </div> 
            </div>

            <div id="MainPanel">
                <div class="headers">
                    <h1 class="Heading-Font">All Books</h1>
                    <button class="Heading-Font add">+</button>
                </div>
                <div class="books">  </div>
            </div>
        </div>
        
    </main>
    <script src="script.js"></script>
</body>
</html>
